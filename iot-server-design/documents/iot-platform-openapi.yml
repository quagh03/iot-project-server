openapi: 3.0.3
info:
  title: Office IoT Monitoring & Control — REST API
  description: |
    REST edge for the Office IoT Monitoring & Control platform: dashboard
    (current state, history, alerts, command status), administration (device
    registry & lifecycle, credentials, users/RBAC, rules, audit), and the
    device HTTP ingest fallback (telemetry, heartbeat). The MQTT
    telemetry/command/heartbeat path is a separate async contract and is
    referenced, not restated, here.

    ## Consumers
    - **Dashboard** (operators, low-tens concurrent) — User JWT (`VIEWER`+).
      Reads current state per zone/sensor (< 300 ms), history over a range
      (< 1 s), device online/offline, alerts, command status.
    - **Admin** (super-admin/admin) — User JWT (`ADMIN`+). Device registry &
      lifecycle, credentials, users/RBAC, rules, audit.
    - **Devices** (HTTP fallback only — MQTT is primary) — device token
      (client-credentials + scopes). `POST` telemetry / heartbeat when the
      broker is unreachable; devices may call **only** the ingest fallback
      endpoints.

    ## Conventions
    - **Versioning:** URI versioning (`/v1/`). Additive changes (new optional
      fields, endpoints, query params) ship within `v1`; only
      removals/renames/type-changes/tightened validation warrant `v2`.
      Deprecations are announced with `Deprecation: true` + `Sunset: <date>`
      response headers and a multi-month migration window.
    - **Casing & dates:** JSON is camelCase. Timestamps are ISO-8601 UTC
      (`2026-06-25T10:30:00Z`). IDs are opaque strings on the wire — internal
      row PKs are never exposed.
    - **Auth:** `Authorization: Bearer <access_token>` on every request
      except `POST /auth/login`, `POST /auth/refresh`, and
      `POST /oauth2/token`. Users carry a stateless JWT (1 h) with role
      (`SUPER_ADMIN > ADMIN > OPERATOR > TECHNICIAN > VIEWER`); devices carry
      an OAuth2 client-credentials token gated by scopes.
    - **Pagination:** cursor-based for large/append-only or time-ordered
      sets (telemetry, commands, alerts, audit-logs); offset-based for
      small/stable admin sets (devices, users, rules, sensors). `pageSize`
      default 50, max 200.
    - **Filtering & sorting:** `?zone=office_1&status=ACTIVE&sort=-createdAt`.
      A leading `-` means descending. Time ranges use `from`/`to` (inclusive
      / exclusive respectively), ISO-8601.
    - **Idempotency:** state-changing `POST`s accept an `Idempotency-Key`
      header (client-generated UUID); the original result is returned on
      retry within a 24 h window. Required for `POST /commands`; supported
      for `POST /devices` and credential issue/rotate.
    - **Errors:** one shape everywhere — RFC 9457 Problem Details.
      `type` (stable, machine-readable) and `status` drive client branching;
      `detail` is human-facing and may change. Validation lists **every**
      failing field. Never `200` with an error body. Stack traces and
      internal messages are never leaked.
    - **Rate limiting:** enforced at the API filter (Redis-backed counters
      when multi-instance): User **100/min**, Device **300/min**, Auth
      **20/min**, telemetry-ingest configurable. Telemetry ingest is limited
      **per device** (keyed to the authenticated identity) — the control
      against sensor flooding/blinding. Over-limit → `429` with `Retry-After`
      and `RateLimit-*` headers; a spike in `403`/`429` is itself an abuse
      signal surfaced to detection.
    - **Security headers:** every response carries
      `Strict-Transport-Security`, `X-Content-Type-Options: nosniff`,
      `X-Frame-Options: DENY`, and a `Content-Security-Policy`. TLS 1.2+ is
      mandatory; plain HTTP is disabled in production. Set globally at the
      edge, not per-operation.

    ## Deliberate constraints to consumers
    - Mandatory bounded time window on partitioned reads (telemetry, audit)
      to protect against accidental full scans.
    - Current-state reads are **eventually consistent by one sample** —
      acceptable per consistency targets, not transactional.
    - Device-plane integrity (safety system, not just a data system): on
      ingest, the payload identity must match the authenticated device token
      (mismatch → `403`) and readings with implausible timestamp skew are
      rejected as stale-replay (→ `422`).
  version: 1.0.0
  contact:
    name: IoT Platform Team
servers:
  - url: https://{host}/api/v1
    description: Production / staging
    variables:
      host:
        default: api.iot.example.com

tags:
  - name: Authentication
    description: >
      User sign-in (JWT + rotating refresh) and device client-credentials token
      issuance. Auth endpoints are rate-limited to 20/min to blunt brute force.
      Refresh tokens are rotated on use and stored hashed server-side so they
      can be revoked before their 30-day expiry.
  - name: Users
    description: >
      Operator accounts and RBAC. Role hierarchy `SUPER_ADMIN > ADMIN >
      OPERATOR > TECHNICIAN > VIEWER`. `SUPER_ADMIN` is required to grant
      `ADMIN`/`SUPER_ADMIN`; `ADMIN` may manage
      `OPERATOR`/`TECHNICIAN`/`VIEWER`. Every role/status change writes an
      audit log entry.
  - name: Devices
    description: >
      Device registry and explicit lifecycle transitions. Lifecycle changes
      have side effects (suspend disables credentials; decommission revokes
      credentials and topic ACLs and is irreversible), so they are named
      actions rather than a free-form `PATCH status` — this prevents illegal
      jumps and makes intent auditable.
  - name: Device Credentials
    description: >
      Device client-credentials and OAuth2 scopes. The client secret is
      returned **exactly once**, at issue or rotation, and never again — only
      metadata is readable afterward. Rotation issues a new secret while the
      previous secret stays valid for a grace window. All issue/rotation/scope
      changes are audited.
  - name: Telemetry
    description: >
      HTTP fallback ingest and time-series history query. Devices `POST` only
      when MQTT is unavailable (same Telemetry Service funnel as the broker
      path). History queries require a bounded time window plus exactly one of
      `sensorId` / `zone` so the partitioned table is never scanned unbounded.
  - name: Current State
    description: >
      Dashboard hot path. "What is each zone reading **now**" and "is this
      device online", served from `sensor_latest` / `device_health`, never
      from the telemetry partitions. **Eventually consistent by one sample** —
      the live view may lag the freshest reading.
  - name: Actuator State
    description: >
      Control-plane mirror of current state, backing the dashboard's toggle
      grid. Keeps `desiredState` (last commanded) distinct from
      `reportedState` (last device-confirmed) — the gap is the in-flight /
      drift signal the UI renders. These are **reads** for `VIEWER`+;
      *commanding* an actuator is the more privileged Commands path. Served
      from `actuator_state`, never from the `commands` history table.
  - name: Heartbeat
    description: >
      HTTP fallback connectivity upsert when MQTT/LWT is unavailable. Updates
      the single `device_health` row, not a history table. The authenticated
      device identity must match the body `deviceId`.
  - name: Commands
    description: >
      Actuator command issue and lifecycle status (`PENDING → RECEIVED →
      SUCCESS/FAILED/TIMEOUT`). The **operator control plane** rides this same
      single pipeline — an operator-issued command is just a row whose
      `issuedBy` is a user id; there is no parallel manual path. Acks arrive
      over MQTT (`iot/command_ack/{device_id}`), not REST — this surface only
      issues and reports. Commands are **idempotent state-sets**
      (`SET status=ON`, not `TOGGLE`); a redelivery is harmless. There is **no
      cancel/delete** — to undo, issue the inverse state-set. Authorization is
      role + zone scoped (routine vs safety actuators); a manual command that
      contradicts an active safety rule is rejected `409`
      (`.../errors/safety-interlock`), overridable only by `SUPER_ADMIN` with
      an explicit, audited reason.
  - name: Rules
    description: >
      Rule engine CRUD. `condition`/`action` are validated **on write**
      against a restricted expression grammar (a safe SpEL/DSL evaluator —
      never `eval`). Bad rules are rejected at the door rather than failing
      silently at evaluation time. Rule changes are audited.
  - name: Alerts
    description: >
      Alert listing and explicit acknowledge / resolve transitions. Status is
      driven by named actions rather than a writable `status` field so the
      audit trail captures *who* acknowledged *what*.
  - name: Audit
    description: >
      Append-only audit log query. There is no create/update/delete endpoint;
      entries are written internally by each module (login, registration,
      credential rotation, rule change, command execution, role change). The
      query hits the partitioned `audit_logs` table and so requires a bounded
      time window like telemetry.

security:
  - userBearer: []

paths:

  # ---------------------------------------------------------------- Auth
  /auth/login:
    post:
      tags: [Authentication]
      summary: User sign-in
      description: >
        Exchange username/password for a 1 h access token and a 30-day rotating
        refresh token. Rate-limited to 20/min per source. Bad credentials
        return `401` (never `403`, never a 200-with-error).
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Rotate refresh token
      description: >
        Mint a new access token and rotate the refresh token — the old one is
        revoked atomically. Reuse of a revoked token returns `401` with type
        `.../errors/token-revoked` (a stateless token you cannot kill is a
        liability; rotation + hashed server-side storage is the mitigation).
        Rate-limited to 20/min.
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Refreshed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the presented refresh token
      description: >
        Revokes the presented refresh token immediately. The currently-issued
        access token remains valid until its 1 h expiry (stateless JWT); clients
        should discard it.
      operationId: logout
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Token revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /oauth2/token:
    post:
      tags: [Authentication]
      summary: Device client-credentials grant
      description: >
        OAuth2 client-credentials token endpoint for devices. Standard
        form-encoded params; granted scopes are the **intersection** of the
        device's stored scopes and any requested via the `scope` parameter.
        The resulting token may be used **only** for the HTTP ingest fallback
        endpoints (`POST /telemetry`, `POST /heartbeat`) — devices are
        forbidden from any other surface. Rate-limited to 20/min.
      operationId: deviceToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/DeviceTokenRequest' }
      responses:
        '200':
          description: Device access token issued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceTokenResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Users
  /users:
    get:
      tags: [Users]
      summary: List users
      description: Offset-paged listing of operator accounts. Min role `ADMIN`.
      operationId: listUsers
      parameters:
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/UserStatus' } }
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of users.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
                  page: { $ref: '#/components/schemas/OffsetPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Users]
      summary: Create a user
      description: >
        Create an operator account. Min role `ADMIN`. Setting a `role` above
        the caller's own authority returns `403`. Duplicate username → `409`.
        No `passwordHash` is ever accepted or returned. Audited.
      operationId: createUser
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Read a user
      description: Min role `ADMIN`.
      operationId: getUser
      responses:
        '200':
          description: User.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Users]
      summary: Update role / status
      description: >
        Min role `ADMIN`. Setting `role` above the caller's own authority →
        `403`. Every role/status change writes an audit entry.
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Users]
      summary: Soft-delete a user
      description: >
        Sets status `DISABLED` and revokes the user's refresh tokens. The
        record is preserved for audit-trail referential integrity (no hard
        delete). Min role `ADMIN`.
      operationId: deleteUser
      responses:
        '204': { description: Disabled. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/{userId}/password-reset:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Issue a password reset
      description: >
        Triggers a reset flow. No plaintext password is accepted or returned.
        Callable by `ADMIN` for any user, or by the target user themselves.
      operationId: resetUserPassword
      responses:
        '204': { description: Reset initiated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Devices
  /devices:
    get:
      tags: [Devices]
      summary: List devices
      description: Offset-paged listing of the device registry. Min role `VIEWER`.
      operationId: listDevices
      parameters:
        - $ref: '#/components/parameters/ZoneFilter'
        - { name: category, in: query, schema: { $ref: '#/components/schemas/DeviceCategory' } }
        - { name: deviceType, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/DeviceStatus' } }
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of devices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Device' }
                  page: { $ref: '#/components/schemas/OffsetPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Devices]
      summary: Register a device
      description: >
        Register a gateway, sensor, or actuator. Min role `ADMIN`. Duplicate
        `deviceId` → `409`. A sensor without a valid `parentGatewayId` → `422`.
        Idempotent via `Idempotency-Key`. Audited.
      operationId: registerDevice
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterDeviceRequest' }
      responses:
        '201':
          description: Registered.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      summary: Read a device
      description: Min role `VIEWER`.
      operationId: getDevice
      responses:
        '200':
          description: Device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Devices]
      summary: Update device metadata
      description: >
        Update mutable metadata (firmware version, zone, device type). Min
        role `ADMIN`. **Status is not patchable here** — use the explicit
        lifecycle action endpoints. Audited.
      operationId: updateDevice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateDeviceRequest' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /devices/{deviceId}/sensors:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      summary: List sensors parented by a gateway
      description: Min role `VIEWER`. Empty list if no sensors are parented.
      operationId: listGatewaySensors
      responses:
        '200':
          description: Sensors.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Sensor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  '/devices/{deviceId}:activate':
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      summary: Activate a device
      description: >
        Lifecycle transition `INACTIVE | SUSPENDED → ACTIVE`. Re-enables the
        device's credentials and broker topic ACLs. Min role `ADMIN`. An
        illegal transition (e.g. activating a `DECOMMISSIONED` device) →
        `409` with type `.../errors/invalid-lifecycle-transition`. Audited.
      operationId: activateDevice
      responses:
        '204': { description: Activated. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  '/devices/{deviceId}:suspend':
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      summary: Suspend a device
      description: >
        Lifecycle transition `ACTIVE → SUSPENDED`. Side effects: disables the
        device's credentials so it cannot mint new tokens or publish. Min role
        `ADMIN`. Illegal transition → `409`. Audited.
      operationId: suspendDevice
      responses:
        '204': { description: Suspended. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  '/devices/{deviceId}:decommission':
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Devices]
      summary: Decommission a device
      description: >
        Terminal lifecycle transition `* → DECOMMISSIONED`. Side effects:
        revokes credentials and broker topic ACLs. **Irreversible** —
        `activate` afterwards returns `409`. Min role `ADMIN`. Audited.
      operationId: decommissionDevice
      responses:
        '204': { description: Decommissioned. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ------------------------------------------------ Device credentials & scopes
  /devices/{deviceId}/credentials:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Device Credentials]
      summary: Read credential metadata
      description: >
        Returns `clientId` and rotation metadata only. The client secret is
        write-once: never readable after issue or rotation — only metadata is
        exposed. Min role `ADMIN`.
      operationId: getDeviceCredentialMetadata
      responses:
        '200':
          description: Credential metadata.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialMetadata' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Device Credentials]
      summary: Issue first credential
      description: >
        Issues a `clientId` / `clientSecret` pair. The secret is shown
        **exactly once** in this response — if lost, the only recovery path
        is to `rotate`. Re-issuing for a device that already has a credential
        → `409` (use rotate instead). Min role `ADMIN`. Idempotent via
        `Idempotency-Key`. Audited.
      operationId: issueDeviceCredential
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Credential issued (secret shown once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialSecret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  '/devices/{deviceId}/credentials:rotate':
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [Device Credentials]
      summary: Rotate credential
      description: >
        Issues a new secret (shown **once** as `clientSecret`). The previous
        secret stays valid until `graceExpiresAt` so the device can update
        in-place without downtime. Min role `ADMIN`. Idempotent via
        `Idempotency-Key`. Audited.
      operationId: rotateDeviceCredential
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Rotated (secret shown once).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CredentialSecret' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/{deviceId}/scopes:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Device Credentials]
      summary: List granted scopes
      description: Min role `ADMIN`.
      operationId: getDeviceScopes
      responses:
        '200':
          description: Scope set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Device Credentials]
      summary: Replace the scope set
      description: >
        Full replace (PUT, not PATCH) — the granted scope set is unambiguous
        in one request. New tokens minted via `/oauth2/token` will intersect
        against this set; existing tokens keep their original scopes until
        expiry. Min role `ADMIN`. Audited.
      operationId: replaceDeviceScopes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScopeSet' }
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopeSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ---------------------------------------------------------------- Telemetry
  /telemetry:
    post:
      tags: [Telemetry]
      summary: HTTP fallback ingest
      description: >
        Accept a batch of readings when MQTT is unavailable. Funnels through
        the same Telemetry Service as the broker path, so behavior is
        consistent. Payload shape is validated synchronously (`422` on bad
        shape); persistence and rule hand-off are asynchronous — hence `202`.
        Device-authenticated; the token must carry scope `telemetry:publish`.
        A reading is numeric **or** boolean — exactly one of `valueNum` /
        `valueBool` is present per item; unknown `sensorType` values are
        rejected (`422`).

        **Device-plane integrity (synchronous, before `202`):** the body
        `gatewayId` must equal the authenticated device identity — a mismatch
        is `403` (a device cannot publish as another; the backend never trusts
        the transport alone). The server stamps its own ingest timestamp;
        readings whose device-supplied `ts` skews implausibly from server time
        (future-dated, or far enough in the past to be a replayed "all clear")
        are rejected as stale-replay → `422`.
      operationId: ingestTelemetry
      security:
        - deviceOAuth: ['telemetry:publish']
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelemetryBatch' }
      responses:
        '202': { description: Accepted for processing. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Telemetry]
      summary: Query telemetry history
      description: >
        Cursor-paged time-series query against the partitioned telemetry
        table. Exactly one of `sensorId` or `zone` is **required**, plus a
        bounded time window (`from` / `to`). These map to the
        `(sensor_id, ts DESC)` / `(zone, ts DESC)` indexes; missing scope or
        an unbounded/oversized window returns `422` (protects the big table
        from accidental full scans). Min role `VIEWER`.
      operationId: queryTelemetry
      parameters:
        - { name: sensorId, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/ZoneFilter'
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of readings.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TelemetryReading' }
                  page: { $ref: '#/components/schemas/CursorPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # -------------------------------------------------------------- Current state
  /current-state:
    get:
      tags: [Current State]
      summary: Latest reading per sensor
      description: >
        Dashboard hot path (< 300 ms target). Served from `sensor_latest`,
        never from the telemetry partitions. **Eventually consistent by one
        sample** — the live view may lag the freshest reading; do not treat
        as transactional. Responses are safe to send with a short
        `Cache-Control: max-age` for polling clients. Min role `VIEWER`.
      operationId: getCurrentState
      parameters:
        - $ref: '#/components/parameters/ZoneFilter'
      responses:
        '200':
          description: Latest readings.
          headers:
            Cache-Control: { schema: { type: string }, description: Short max-age for polling clients. }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CurrentStateItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /sensors/{sensorId}/latest:
    parameters:
      - $ref: '#/components/parameters/SensorId'
    get:
      tags: [Current State]
      summary: Latest reading for one sensor
      description: >
        Single-sensor variant of `/current-state`. Eventually consistent by one
        sample. Min role `VIEWER`.
      operationId: getSensorLatest
      responses:
        '200':
          description: Latest reading.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentStateItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /devices/{deviceId}/health:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Current State]
      summary: Latest device health & connectivity
      description: >
        Latest row from `device_health` — connection status, last seen, and
        most recent resource telemetry (memory, CPU, RSSI). Min role `VIEWER`.
      operationId: getDeviceHealth
      responses:
        '200':
          description: Health.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceHealth' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /connectivity:
    get:
      tags: [Current State]
      summary: Online/offline roll-up
      description: >
        Aggregated online/offline counts across devices, optionally scoped by
        zone. The `offlineDevices` list is bounded — large fleets should drill
        in via `/devices/{deviceId}/health`. Min role `VIEWER`.
      operationId: getConnectivity
      parameters:
        - $ref: '#/components/parameters/ZoneFilter'
      responses:
        '200':
          description: Connectivity summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConnectivitySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ------------------------------------------------------------- Actuator state
  /actuator-state:
    get:
      tags: [Actuator State]
      summary: Desired-vs-reported state per actuator
      description: >
        Toggle-grid hot path. Returns one row per actuator with `desiredState`
        (last commanded) and `reportedState` (last device-confirmed). Set
        `?drifted=true` for the operator "needs attention" view — only rows
        where `desiredState ≠ reportedState`, served by the partial drift
        index, never a scan. `?zone=` filters the grid (resolved by joining
        `devices`; `zone` is not stored on the mirror). **Eventually
        consistent by one sample.** Min role `VIEWER`.
      operationId: listActuatorState
      parameters:
        - $ref: '#/components/parameters/ZoneFilter'
        - name: drifted
          in: query
          description: When `true`, return only actuators whose desired and reported states disagree (in-flight or drifted).
          schema: { type: boolean }
      responses:
        '200':
          description: Latest actuator states.
          headers:
            Cache-Control: { schema: { type: string }, description: Short max-age for polling clients. }
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ActuatorState' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/{deviceId}/actuator-state:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Actuator State]
      summary: Desired-vs-reported state for one actuator
      description: >
        Single-actuator variant for the toggle UI. A `deviceId` that is not an
        actuator, or has no state row yet, → `404`. Eventually consistent by
        one sample. Min role `VIEWER`.
      operationId: getActuatorState
      responses:
        '200':
          description: Actuator state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActuatorState' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Heartbeat
  /heartbeat:
    post:
      tags: [Heartbeat]
      summary: HTTP fallback heartbeat
      description: >
        Upsert the calling device's latest `device_health` row (single row per
        device — not a history table). Returns `202`; the upsert is applied
        asynchronously. The authenticated device identity **must** match the
        body `deviceId`; otherwise `403` (a device cannot report health for
        another). Device-authenticated with scope `heartbeat:publish`.
      operationId: ingestHeartbeat
      security:
        - deviceOAuth: ['heartbeat:publish']
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HeartbeatRequest' }
      responses:
        '202': { description: Accepted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  # ---------------------------------------------------------------- Commands
  /commands:
    get:
      tags: [Commands]
      summary: List commands
      description: >
        Cursor-paged list of commands; the dashboard uses this for the
        command history view. Time window is recommended on large fleets.
        Min role `VIEWER`.
      operationId: listCommands
      parameters:
        - { name: targetId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/CommandStatus' } }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of commands.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Command' }
                  page: { $ref: '#/components/schemas/CursorPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Commands]
      summary: Issue a command
      description: >
        Persist a command record and publish it to the actuator over MQTT.
        Returns **`202`**, not `201`: the resource (the command record)
        exists, but the *effect* (actuator reacting) is asynchronous over
        MQTT — poll `GET /commands/{commandId}` for the
        `PENDING → RECEIVED → SUCCESS/FAILED/TIMEOUT` lifecycle. Acks arrive
        over MQTT (`iot/command_ack/{device_id}`), not REST.

        **`Idempotency-Key` is required** so MQTT QoS-1 at-least-once
        retries are safe. Commands are **idempotent state-sets**
        (`SET status=ON`, not `TOGGLE`) and devices dedupe on `commandId`,
        so a redelivery is harmless. There is deliberately **no cancel /
        delete** — a command in flight cannot be recalled; issue the inverse
        state-set instead. Commands with no ack within the window are swept
        to `TIMEOUT` server-side. Issuing also upserts
        `actuator_state.desiredState` so the toggle grid reflects intent
        immediately; the device ack later sets `reportedState`.

        **Validation (`422`):** the target must be an **`ACTIVE` actuator** —
        a sensor/gateway, or an `INACTIVE`/`SUSPENDED`/`DECOMMISSIONED` device,
        is rejected; `action` + `parameters` must match the per-`deviceType`
        whitelist (no free-form passthrough — injection defense).

        **Authorization (`403`):** role + zone scoped. Roles split actuators
        into routine (light/AC/curtain) and safety (exhaust/smoke-linked);
        `VIEWER` cannot command, `OPERATOR` may drive routine actuators in
        permitted zones and turn safety actuators ON/escalate, `ADMIN` any
        actuator, `SUPER_ADMIN` additionally may override safety rules.
        `OPERATOR` zone scope is checked against `user_zone_grants` if adopted.

        **Safety interlock (`409`):** a manual command that contradicts an
        active safety action (e.g. `exhaust OFF` while a smoke rule holds it
        `ON`) is rejected with type `.../errors/safety-interlock` for everyone
        below `SUPER_ADMIN`. `SUPER_ADMIN` may override only with
        `override: true` + a non-empty `overrideReason`, which logs a distinct
        `SAFETY_OVERRIDE` audit event. Every manual command writes a
        `MANUAL_COMMAND` audit entry and counts against the per-user rate
        limit.

        Min role `OPERATOR`. Audited.
      operationId: issueCommand
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssueCommandRequest' }
      responses:
        '202':
          description: Command accepted (PENDING).
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandAck' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /commands/{commandId}:
    parameters:
      - $ref: '#/components/parameters/CommandId'
    get:
      tags: [Commands]
      summary: Command status / lifecycle
      description: >
        Poll target for `PENDING → RECEIVED → SUCCESS/FAILED/TIMEOUT`. Clients
        observe `TIMEOUT` purely through `status` — there is no separate
        timeout endpoint. Min role `VIEWER`.
      operationId: getCommand
      responses:
        '200':
          description: Command.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Command' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Rules
  /rules:
    get:
      tags: [Rules]
      summary: List rules
      description: Offset-paged. Min role `OPERATOR`.
      operationId: listRules
      parameters:
        - { name: enabled, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Page of rules.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Rule' }
                  page: { $ref: '#/components/schemas/OffsetPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Rules]
      summary: Create a rule
      description: >
        Create a rule evaluated asynchronously against telemetry/state.
        `condition` / `action` are validated **on write** against the
        restricted expression grammar (a safe SpEL/DSL evaluator — never
        `eval`). A condition that references unknown state, uses disallowed
        syntax, or fails to parse → `422` with the offending token, so bad
        rules are rejected at the door rather than failing silently at
        evaluation time. Min role `ADMIN`. Audited.
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '201':
          description: Created.
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /rules/{ruleId}:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    get:
      tags: [Rules]
      summary: Read a rule
      description: Min role `OPERATOR`.
      operationId: getRule
      responses:
        '200':
          description: Rule.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Rules]
      summary: Replace a rule
      description: >
        Full rewrite. `condition` / `action` re-validated against the
        expression grammar; `422` on parse/semantic failure. Min role `ADMIN`.
        Audited.
      operationId: replaceRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '200':
          description: Replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    patch:
      tags: [Rules]
      summary: Toggle enabled / change priority
      description: >
        Narrow patch for the common toggle/priority case. To change
        `condition` or `action`, use `PUT`. Min role `ADMIN`. Audited.
      operationId: updateRule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RulePatch' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      tags: [Rules]
      summary: Delete a rule
      description: >
        Removes the rule from evaluation. Min role `ADMIN`. Audited.
      operationId: deleteRule
      responses:
        '204': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Alerts
  /alerts:
    get:
      tags: [Alerts]
      summary: List alerts
      description: >
        Cursor-paged list of alerts, filterable by status / zone / severity /
        time window. Min role `VIEWER`.
      operationId: listAlerts
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/AlertStatus' } }
        - $ref: '#/components/parameters/ZoneFilter'
        - { name: severity, in: query, schema: { $ref: '#/components/schemas/Severity' } }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of alerts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }
                  page: { $ref: '#/components/schemas/CursorPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /alerts/{alertId}:
    parameters:
      - $ref: '#/components/parameters/AlertId'
    get:
      tags: [Alerts]
      summary: Read an alert
      description: Min role `VIEWER`.
      operationId: getAlert
      responses:
        '200':
          description: Alert.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  '/alerts/{alertId}:acknowledge':
    parameters:
      - $ref: '#/components/parameters/AlertId'
    post:
      tags: [Alerts]
      summary: Acknowledge an alert
      description: >
        Explicit transition `OPEN → ACK`. Driven by named action rather than
        a writable `status` so the audit trail captures *who* acknowledged
        *what*. Acknowledging an already-resolved alert → `409`. Min role
        `OPERATOR`. Audited.
      operationId: acknowledgeAlert
      responses:
        '200':
          description: Acknowledged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  '/alerts/{alertId}:resolve':
    parameters:
      - $ref: '#/components/parameters/AlertId'
    post:
      tags: [Alerts]
      summary: Resolve an alert
      description: >
        Explicit transition `OPEN | ACK → RESOLVED`. Resolving a
        non-existent or already-resolved alert → `409`. Min role `OPERATOR`.
        Audited.
      operationId: resolveAlert
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ---------------------------------------------------------------- Audit
  /audit-logs:
    get:
      tags: [Audit]
      summary: Query audit logs
      description: >
        Cursor-paged query over the partitioned, **append-only** `audit_logs`
        table. There is no create/update/delete endpoint — entries are
        written internally by each module (login, registration/deletion,
        credential rotation, rule change, command execution, role change).
        A bounded time window (`from` / `to`) is **required** like telemetry;
        unbounded or oversized windows → `422`. Min role `ADMIN`.
      operationId: queryAuditLogs
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: actorType, in: query, schema: { $ref: '#/components/schemas/ActorType' } }
        - { name: event, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Page of audit entries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  page: { $ref: '#/components/schemas/CursorPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

# ============================================================== Components
components:

  securitySchemes:
    userBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        User JWT access token (1 h). Carries role
        (`SUPER_ADMIN | ADMIN | OPERATOR | TECHNICIAN | VIEWER`) for RBAC. Refresh via
        `POST /auth/refresh` (rotating refresh token, 30-day expiry, server
        revocable).
    deviceOAuth:
      type: oauth2
      description: >
        Device client-credentials token, gated by scopes. Granted scopes are
        the intersection of the device's stored scopes and any requested.
        Usable **only** for HTTP ingest fallback endpoints.
      flows:
        clientCredentials:
          tokenUrl: https://api.iot.example.com/api/v1/oauth2/token
          scopes:
            telemetry:publish: Publish telemetry readings (HTTP fallback ingest).
            heartbeat:publish: Publish heartbeat / health (HTTP fallback).
            command:subscribe: Subscribe to commands (MQTT — not REST).
            command:ack: Acknowledge commands (MQTT — not REST).

  headers:
    Location:
      description: URI of the created or referenced resource.
      schema: { type: string, format: uri }
    RetryAfter:
      description: Seconds to wait before retrying.
      schema: { type: integer }

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID; the original result is returned on retry within 24 h.
      schema: { type: string, format: uuid }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID; required so at-least-once retries do not duplicate effects.
      schema: { type: string, format: uuid }
    PageSize:
      name: pageSize
      in: query
      description: Items per page. Bounded (default 50, max 200) to protect read paths.
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: >
        Opaque cursor from a previous page's `nextCursor`. Stable under
        concurrent writes; do not parse or modify.
      schema: { type: string }
    Offset:
      name: offset
      in: query
      description: Zero-based offset into the result set. Used by stable admin lists.
      schema: { type: integer, minimum: 0, default: 0 }
    Limit:
      name: limit
      in: query
      description: Items per page for offset-paged endpoints (default 50, max 200).
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Sort:
      name: sort
      in: query
      description: >
        Field name; prefix with `-` for descending (e.g. `-createdAt`). Only
        whitelisted fields per endpoint are sortable.
      schema: { type: string }
    From:
      name: from
      in: query
      description: >
        Inclusive start of time window (ISO-8601 UTC). Required for
        partitioned reads (telemetry, audit, commands list).
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      description: >
        Exclusive end of time window (ISO-8601 UTC). The `(from, to)` span is
        bounded server-side; oversized windows → `422`.
      schema: { type: string, format: date-time }
    ZoneFilter:
      name: zone
      in: query
      description: Zone identifier (e.g. `office_1`). Unknown zones return an empty list, not `404`.
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string }
    SensorId:
      name: sensorId
      in: path
      required: true
      schema: { type: string }
    CommandId:
      name: commandId
      in: path
      required: true
      schema: { type: string }
    RuleId:
      name: ruleId
      in: path
      required: true
      schema: { type: string }
    AlertId:
      name: alertId
      in: path
      required: true
      schema: { type: string }

  responses:
    BadRequest:
      description: Malformed request — JSON parse failure or schema-level violation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Unauthorized:
      description: Not authenticated — missing, expired, or revoked credential.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Forbidden:
      description: Authenticated but not allowed by role (user) or scope (device).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    NotFound:
      description: Resource not found, or hidden from the caller's authorization scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    Conflict:
      description: >
        State conflict — duplicate id, illegal lifecycle transition, version
        conflict, attempt to acknowledge/resolve an alert in a wrong state, or
        a command rejected by the safety interlock
        (`.../errors/safety-interlock`) because it contradicts an active
        safety rule.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    UnprocessableEntity:
      description: >
        Well-formed but semantically invalid — failed validation, broken
        invariants (e.g. sensor without `parentGatewayId`), or scope/window
        constraints (e.g. unbounded telemetry/audit query).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }
    TooManyRequests:
      description: >
        Rate limit exceeded. Includes `Retry-After` and `RateLimit-*`
        headers. Per limits — User 100/min, Device 300/min, Auth 20/min.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetail' }

  schemas:

    # ----- shared / enums
    ProblemDetail:
      type: object
      description: >
        RFC 9457 Problem Details. `type` (stable, machine-readable URI) and
        `status` drive client branching; `detail` is human-facing and may
        change. Validation failures list every offending field in `errors`.
      properties:
        type: { type: string, format: uri, description: "Stable, machine-readable error type URI." }
        title: { type: string, description: Short human-readable summary. }
        status: { type: integer, description: HTTP status code. }
        detail: { type: string, description: Human-readable detail; may change between releases. }
        instance: { type: string, description: URI reference identifying the specific occurrence. }
        errors:
          type: array
          description: Per-field validation failures (present on `422` typically).
          items: { $ref: '#/components/schemas/FieldError' }
    FieldError:
      type: object
      properties:
        field: { type: string }
        message: { type: string }
    CursorPage:
      type: object
      description: >
        Pagination metadata for cursor-based collections (telemetry,
        commands, alerts, audit-logs). `nextCursor` is opaque.
      properties:
        nextCursor: { type: string, nullable: true, description: Pass to next request; null when exhausted. }
        hasMore: { type: boolean }
        pageSize: { type: integer }
    OffsetPage:
      type: object
      description: >
        Pagination metadata for offset-based collections (devices, users,
        rules, sensors). Includes total count for table UIs.
      properties:
        offset: { type: integer }
        limit: { type: integer }
        total: { type: integer }
    Role:
      type: string
      description: >
        Hierarchical role. `SUPER_ADMIN > ADMIN > OPERATOR > TECHNICIAN >
        VIEWER`. `SUPER_ADMIN` may grant `ADMIN`/`SUPER_ADMIN`; `ADMIN`
        manages `OPERATOR`/`TECHNICIAN`/`VIEWER`. `TECHNICIAN` is a
        maintenance/field role between `OPERATOR` and `VIEWER`: it reads all
        state and may command routine actuators in permitted zones, but not
        safety actuators and never a safety override.
      enum: [SUPER_ADMIN, ADMIN, OPERATOR, TECHNICIAN, VIEWER]
    UserStatus:
      type: string
      description: >
        `ACTIVE` users may authenticate; `DISABLED` is the soft-delete
        terminal state (set by `DELETE /users/{userId}`).
      enum: [ACTIVE, DISABLED]
    DeviceCategory:
      type: string
      description: >
        `gateway` aggregates child sensors and brokers MQTT; `sensor` is a
        leaf producer (parented by a gateway); `actuator` accepts commands.
      enum: [gateway, sensor, actuator]
    DeviceStatus:
      type: string
      description: >
        Lifecycle state. Transitions are driven by explicit named actions
        (`:activate`, `:suspend`, `:decommission`). `DECOMMISSIONED` is
        terminal.
      enum: [ACTIVE, INACTIVE, SUSPENDED, DECOMMISSIONED]
    CommandStatus:
      type: string
      description: >
        Command lifecycle. `PENDING` on issue, `RECEIVED` on device receipt
        ack (MQTT), `SUCCESS` / `FAILED` on execution ack, `TIMEOUT` if no
        ack within the configured window.
      enum: [PENDING, RECEIVED, SUCCESS, FAILED, TIMEOUT]
    AlertStatus:
      type: string
      description: Alert lifecycle; driven by explicit acknowledge / resolve actions.
      enum: [OPEN, ACK, RESOLVED]
    Severity:
      type: string
      enum: [INFO, WARNING, CRITICAL]
    ActorType:
      type: string
      description: >
        Origin of an audit event. `USER` for operator JWT actions, `DEVICE`
        for device-token actions, `SYSTEM` for engine-triggered actions
        (rule engine, sweeper).
      enum: [USER, DEVICE, SYSTEM]

    # ----- auth
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password, description: Plaintext only on the wire over TLS; never logged. }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, description: Rotating refresh token previously issued. Single-use — server rotates on accept. }
    TokenResponse:
      type: object
      description: User access + rotating refresh token pair, plus role for client routing.
      properties:
        accessToken: { type: string, description: "Short-lived JWT (1 h). Send as `Authorization: Bearer ...`." }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, example: 3600, description: Seconds until `accessToken` expires. }
        refreshToken: { type: string, description: New rotating refresh token (30-day expiry); replaces any prior token. }
        role: { $ref: '#/components/schemas/Role' }
    DeviceTokenRequest:
      type: object
      description: Standard OAuth2 client-credentials grant body (form-encoded).
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type: { type: string, enum: [client_credentials] }
        client_id: { type: string }
        client_secret: { type: string }
        scope: { type: string, description: Space-delimited requested scopes. Granted set is the intersection with the device's stored scopes. }
    DeviceTokenResponse:
      type: object
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: Seconds until expiry. }
        scope: { type: string, description: Space-delimited granted scopes (may be narrower than requested). }

    # ----- users
    User:
      type: object
      description: Operator account. Note the deliberate absence of `passwordHash` on the wire.
      properties:
        id: { type: string, description: Opaque user id (e.g. `usr_8f3a`). }
        username: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }
        createdAt: { type: string, format: date-time }
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string }
        password: { type: string, format: password, description: Plaintext only on the wire over TLS; never logged or returned. }
        role: { $ref: '#/components/schemas/Role' }
    UpdateUserRequest:
      type: object
      description: Partial update; both fields are optional but at least one must be present.
      properties:
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/UserStatus' }

    # ----- devices
    Device:
      type: object
      properties:
        deviceId: { type: string, description: Caller-supplied stable identifier (e.g. `gw_office1_01`). }
        category: { $ref: '#/components/schemas/DeviceCategory' }
        deviceType: { type: string, example: temp, description: "Free-form sub-type (e.g. `temp`, `smoke`, `exhaust`)." }
        zone: { type: string, description: Logical placement (e.g. `office_1`). }
        parentGatewayId: { type: string, nullable: true, description: "For sensors, the parenting gateway's `deviceId`. Null for gateways and actuators." }
        firmwareVersion: { type: string }
        status: { $ref: '#/components/schemas/DeviceStatus' }
        protocols:
          type: array
          description: Supported wire protocols (e.g. `mqtt`, `http`).
          items: { type: string }
        createdAt: { type: string, format: date-time }
    RegisterDeviceRequest:
      type: object
      required: [deviceId, category, deviceType, zone]
      properties:
        deviceId: { type: string, description: Must be unique. Duplicate → `409`. }
        category: { $ref: '#/components/schemas/DeviceCategory' }
        deviceType: { type: string }
        zone: { type: string }
        parentGatewayId: { type: string, nullable: true, description: Required when `category` is `sensor`. Missing or invalid → `422`. }
        firmwareVersion: { type: string }
        protocols:
          type: array
          items: { type: string }
    UpdateDeviceRequest:
      type: object
      description: >
        Partial update of mutable metadata. Status is **not** patchable here
        — use the lifecycle action endpoints.
      properties:
        zone: { type: string }
        deviceType: { type: string }
        firmwareVersion: { type: string }
    Sensor:
      type: object
      description: Sensor view as returned by the gateway's sensor list.
      properties:
        sensorId: { type: string }
        gatewayId: { type: string }
        type: { type: string, description: "Sensor sub-type (e.g. `temp`, `smoke`)." }
        zone: { type: string }

    # ----- credentials & scopes
    CredentialSecret:
      type: object
      description: >
        Returned **exactly once** on issue / rotation. Persist immediately;
        the API will never re-emit the secret. If lost, call
        `:rotate` to mint a new one.
      properties:
        clientId: { type: string }
        clientSecret: { type: string, description: Shown once; reissue or rotate if lost. }
        rotatedAt: { type: string, format: date-time }
        graceExpiresAt: { type: string, format: date-time, nullable: true, description: "While non-null, the previous secret remains valid until this timestamp." }
    CredentialMetadata:
      type: object
      description: Safe metadata view — never includes the client secret.
      properties:
        clientId: { type: string }
        rotatedAt: { type: string, format: date-time }
    ScopeSet:
      type: object
      description: >
        Full scope set granted to a device's stored credential. Tokens minted
        via `/oauth2/token` intersect requested scopes against this set.
      required: [scopes]
      properties:
        scopes:
          type: array
          items:
            type: string
            enum: [telemetry:publish, command:subscribe, command:ack, heartbeat:publish]

    # ----- telemetry
    TelemetryReadingInput:
      type: object
      description: >
        One reading. Exactly one of `valueNum` / `valueBool` must be present
        — numeric sensors set `valueNum` (with optional `unit`); boolean
        sensors set `valueBool`. Mixing both → `422`.
      required: [sensorId, sensorType, ts]
      properties:
        sensorId: { type: string }
        sensorType: { type: string }
        valueNum: { type: number, format: double, nullable: true, description: Present for numeric sensors. }
        valueBool: { type: boolean, nullable: true, description: Present for boolean sensors. }
        unit: { type: string, nullable: true, description: "SI unit for numeric readings (e.g. `C`, `%`)." }
        ts: { type: string, format: date-time, description: "Device-side capture timestamp (ISO-8601 UTC). Retained as capture time, but the server also stamps its own ingest timestamp; implausible skew (future-dated or far-past) is rejected as stale-replay → `422`." }
    TelemetryBatch:
      type: object
      description: Batch payload for the HTTP fallback ingest. Mirrors the MQTT telemetry envelope.
      required: [gatewayId, zone, readings]
      properties:
        gatewayId: { type: string, description: "Must equal the authenticated device identity (not merely a registered gateway); a mismatch → `403`." }
        zone: { type: string }
        readings:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TelemetryReadingInput' }
    TelemetryReading:
      type: object
      properties:
        sensorId: { type: string }
        zone: { type: string }
        sensorType: { type: string }
        valueNum: { type: number, format: double, nullable: true }
        valueBool: { type: boolean, nullable: true }
        unit: { type: string, nullable: true }
        ts: { type: string, format: date-time }

    # ----- current state / health
    CurrentStateItem:
      type: object
      description: >
        Latest known reading for one sensor, served from `sensor_latest`.
        May lag the freshest sample by one (eventual consistency).
      properties:
        sensorId: { type: string }
        zone: { type: string }
        sensorType: { type: string }
        valueNum: { type: number, format: double, nullable: true }
        valueBool: { type: boolean, nullable: true }
        unit: { type: string, nullable: true }
        ts: { type: string, format: date-time, description: Timestamp on the underlying reading (not when this row was written). }
    DeviceHealth:
      type: object
      description: Single-row health view; the latest known health record (no history).
      properties:
        deviceId: { type: string }
        connectionStatus: { type: string, enum: [ONLINE, OFFLINE], description: Derived from heartbeat / LWT presence. }
        lastSeen: { type: string, format: date-time, description: Last heartbeat or telemetry timestamp. }
        memoryUsagePct: { type: integer, minimum: 0, maximum: 100 }
        cpuUsagePct: { type: integer, minimum: 0, maximum: 100 }
        wifiRssi: { type: integer, description: Signal strength in dBm (negative — closer to 0 is stronger). }
        updatedAt: { type: string, format: date-time }
    ConnectivitySummary:
      type: object
      description: Aggregated online/offline counts plus a bounded sample of offline `deviceId`s.
      properties:
        online: { type: integer }
        offline: { type: integer }
        total: { type: integer }
        offlineDevices:
          type: array
          description: Bounded list of offline device ids; large fleets should drill in per-device.
          items: { type: string }

    # ----- actuator state
    ActuatorState:
      type: object
      description: >
        Control-plane mirror for one actuator (the `actuator_state` row).
        `desiredState` is what was last commanded; `reportedState` is what the
        device last confirmed via ack/telemetry. Their gap is the in-flight /
        drift signal the toggle UI renders. Eventually consistent by one
        sample.
      properties:
        deviceId: { type: string, description: Actuator `deviceId`. }
        zone: { type: string, description: Resolved from the device registry (not stored on the mirror). }
        desiredState: { type: string, nullable: true, description: "Last commanded state (e.g. `ON`, `OFF`, `OPEN`); null if never commanded." }
        reportedState: { type: string, nullable: true, description: Last device-confirmed state; null until the first ack/telemetry. }
        inFlight: { type: boolean, description: "Server-computed convenience: `desiredState != reportedState` — a command in flight or a drift to investigate." }
        attributes:
          type: object
          additionalProperties: true
          description: "Structured actuator attributes (e.g. setpoint, level, mode)."
          example: { level: 3, mode: auto }
        lastCommandId: { type: string, nullable: true, description: "`commandId` of the most recent command targeting this actuator (traceability; null if pruned)." }
        commandedAt: { type: string, format: date-time, nullable: true, description: When the last command was issued. }
        updatedAt: { type: string, format: date-time, description: When this mirror row last changed (command issue or ack). }

    # ----- heartbeat
    HeartbeatRequest:
      type: object
      description: >
        Health upsert. `deviceId` must match the authenticated device
        identity (a device cannot report on behalf of another); mismatch →
        `403`.
      required: [deviceId]
      properties:
        deviceId: { type: string }
        memoryUsagePct: { type: integer, minimum: 0, maximum: 100 }
        cpuUsagePct: { type: integer, minimum: 0, maximum: 100 }
        wifiRssi: { type: integer, description: Signal strength in dBm. }

    # ----- commands
    IssueCommandRequest:
      type: object
      description: >
        Idempotent state-set targeting an actuator. Use absolute states
        (`SET status=ON`), not deltas (`TOGGLE`), so MQTT QoS-1 redeliveries
        are harmless. `action` and `parameters` are **whitelisted** against
        the actuator's contract (injection defense — no free-form passthrough
        to the device); unknown actions/params, or targeting a non-`ACTIVE`
        actuator → `422`.
      required: [targetId, type, action]
      properties:
        targetId: { type: string, description: Actuator `deviceId` — must be an `ACTIVE` actuator. }
        type: { type: string, example: actuator }
        action: { type: string, example: SET, description: Verb in the actuator's contract (typically `SET`). }
        parameters:
          type: object
          additionalProperties: true
          description: Action arguments — shape per actuator contract.
          example: { status: ON }
        override:
          type: boolean
          default: false
          description: >
            Safety-override flag. Only `SUPER_ADMIN` may set `true`, and only
            to issue a command the safety interlock would otherwise reject
            (`409`). Requires `overrideReason`. Set by a lower role → `403`.
        overrideReason:
          type: string
          description: >
            Mandatory justification when `override` is `true`; recorded on the
            `SAFETY_OVERRIDE` audit event. Missing while `override=true` → `422`.
    CommandAck:
      type: object
      description: Response on issue. Status is always `PENDING` here — the actuator effect is async.
      properties:
        commandId: { type: string }
        status: { $ref: '#/components/schemas/CommandStatus' }
        issuedAt: { type: string, format: date-time }
    Command:
      type: object
      description: Command record with full lifecycle timestamps. Poll for state changes.
      properties:
        commandId: { type: string }
        targetId: { type: string }
        type: { type: string }
        action: { type: string }
        parameters:
          type: object
          additionalProperties: true
        status: { $ref: '#/components/schemas/CommandStatus' }
        issuedBy: { type: string, description: "User id, rule id, or system." }
        issuedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time, nullable: true, description: Set when the device acks receipt (MQTT). }
        executedAt: { type: string, format: date-time, nullable: true, description: Set when the device acks execution outcome (MQTT). }

    # ----- rules
    Rule:
      type: object
      description: A rule evaluated asynchronously against telemetry/state by the rule engine.
      properties:
        ruleId: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        condition: { type: string, example: "office_1.smoke == true", description: Expression in the restricted grammar. }
        action: { type: string, example: "command(act_exhaust_1, SET, {status: ON}); alert(SMOKE, CRITICAL)", description: "One or more semicolon-separated effects (`command(...)`, `alert(...)`)." }
        priority: { type: integer, description: Higher priority rules evaluate first; deterministic for conflicting actions. }
        createdBy: { type: string, description: "`userId` of the admin that authored the rule." }
    RuleInput:
      type: object
      description: >
        Create / replace payload. `condition` and `action` are validated on
        write — unknown state references, disallowed syntax, or parse
        failures → `422` with the offending token.
      required: [name, condition, action]
      properties:
        name: { type: string }
        enabled: { type: boolean, default: true }
        condition: { type: string }
        action: { type: string }
        priority: { type: integer, default: 0 }
    RulePatch:
      type: object
      description: Narrow patch for the common toggle / priority case.
      properties:
        enabled: { type: boolean }
        priority: { type: integer }

    # ----- alerts
    Alert:
      type: object
      description: >
        An alert raised by a rule's `alert(...)` action. `status` transitions
        are driven by `:acknowledge` / `:resolve`, not by direct write.
      properties:
        alertId: { type: string }
        type: { type: string, example: SMOKE, description: "Caller-defined category (e.g. `SMOKE`, `OFFLINE`)." }
        severity: { $ref: '#/components/schemas/Severity' }
        zone: { type: string }
        sourceDeviceId: { type: string, description: Originating sensor / device id. }
        message: { type: string }
        status: { $ref: '#/components/schemas/AlertStatus' }
        createdAt: { type: string, format: date-time }

    # ----- audit
    AuditLog:
      type: object
      description: >
        Append-only audit entry written internally by modules
        (auth, device registry, credentials, rules, commands, RBAC).
      properties:
        id: { type: string }
        ts: { type: string, format: date-time }
        actor: { type: string, description: "Identifier of the actor — `userId`, `deviceId`, or `SYSTEM`." }
        actorType: { $ref: '#/components/schemas/ActorType' }
        event: { type: string, description: "Stable event code (e.g. `USER_LOGIN`, `DEVICE_SUSPEND`, `CREDENTIAL_ROTATE`)." }
        target: { type: string, description: "Affected resource id, when applicable." }
        detail:
          type: object
          additionalProperties: true
          description: Event-specific payload. Sensitive fields (secrets, passwords) are never present.
        ip: { type: string, description: Source IP captured at the API boundary. }
