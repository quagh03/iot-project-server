spring:
  application:
    name: iot-project-server
  profiles:
    default: local
  jackson:
    default-property-inclusion: NON_NULL
    time-zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  pattern:
    # %X{correlationId} is bound per-request by CorrelationIdFilter; "system" for
    # non-request threads (startup, scheduled jobs).
    level: "%5p [%X{correlationId:-system}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /api/v1/api-docs
  swagger-ui:
    path: /api/v1/swagger-ui.html
  show-actuator: true

iot:
  rate-limit:
    enabled: true
    user-per-minute: 100
    device-per-minute: 300
    auth-per-minute: 20
    telemetry-per-minute: 600
  redis:
    enabled: false
  security:
    jwt:
      issuer: iot-platform
      access-token-ttl: 1h
      refresh-token-ttl: 30d
      device-token-ttl: 1h
  idempotency:
    ttl-hours: 24
  pagination:
    default-page-size: 50
    max-page-size: 200
  partitioning:
    tables:
      - telemetry
      - audit_logs
    retention-months: 0   # 0 = retention drop disabled (Open Question #1)
    dry-run: true         # log dropped partitions instead of actually dropping
